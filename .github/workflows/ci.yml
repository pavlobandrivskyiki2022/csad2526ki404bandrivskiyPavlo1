# Prompt: Create a GitHub Actions workflow that:
# - triggers on push and pull_request to branches that contain 'develop' or 'master' in their names
# - runs a single job 'cross_build' with a matrix of OS: ubuntu-latest, macos-latest, windows-latest
# - steps: checkout; configure and build with CMake; run tests (ctest); upload the built executable as an artifact
# - prefer calling the repo script (ci.sh on Linux/macos, ci.cmd on Windows) if available
# - ensure windows uses shell: bash for a consistent CMake invocation or use cmd for ci.cmd accordingly

name: CI

on:
  push:
    branches:
      - "*develop*"
      - "*master*"
  pull_request:
    branches:
      - "*develop*"
      - "*master*"

jobs:
  cross_build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: "latest"

      - name: Configure and Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f ./ci.sh ]; then
            chmod +x ./ci.sh
            ./ci.sh
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release --parallel
            ctest --test-dir build --output-on-failure -C Release
          fi

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist ci.cmd (
            call ci.cmd
          ) else (
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
            ctest --test-dir build --output-on-failure -C Release
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            build/**
